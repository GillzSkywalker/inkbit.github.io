<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkBit - Sign up</title>
    <link rel='stylesheet'href="styles.css">
    
</head>
<body>
        <div class="login-container">
        <h2>Welcome to <span>InkBit</span></h2>
        <h4>Track one of your favorite series to revive your reality.</h4>

        <form id="login-form">
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <input type="confirm-password" id="pasword" name="confirmed password" placeholder="confirm password" required> 
            
            
            
            <button type="submit" class="btn-primary">Log in</button>
            <button type="button" class="btn-secondary" id="guest-btn"><a href="./landing/index.html">Continue</a> as Guest</button>
        </form>

        <p class="signup-text">
            Back to sign in? <a href="inkbit/index.html">Sign in</a>
        </p>
    </div>

    <footer>
        Secure • Private • Your collection, your way
    </footer>

    <script src="script.js"></script>
</body>
</html>
